; ST6IX V1.3 - post-processing filter for Pure Gamma on SDR displays
; Pure runs the matching script pure_scripts/ST6IX_PP_V1.3.lua.
; Keep this file name and the script name identical.
; The script drives tone mapping, exposure, glare, godrays, lens and colour live;
; the values below are the neutral base it starts from.

[ABOUT]
AUTHOR=ST6IX
VERSION=1.3

[YEBIS]
ENABLED=1

[AUTO_EXPOSURE]
ENABLED=1

[TONEMAPPING]
GAMMA=1.1

[COLOR]
BRIGHTNESS=1
CONTRAST=1
SATURATION=1
HUE=0
SEPIA=0
COLOR_TEMP=6500
WHITE_BALANCE=6500

[GLARE]
ENABLED=1
USE_CUSTOM_SHAPE=1
QUALITY=4

[GODRAYS]
ENABLED=1
USE_SUN_LIGHT=1

[DOF]
ENABLED=0

[CHROMATIC_ABERRATION]
ENABLED=0

[LENSDISTORTION]
ENABLED=0

[VIGNETTING]
STRENGTH=0.01

[EXT_COLOR_GRADING]
ENABLED=0
