<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balance &amp; Wellbeing — Leading Self | Impact for Learning &amp; Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0A141D; }
  body { font-family: 'Inter', Helvetica, Arial, sans-serif; color: #F4FBFC; -webkit-font-smoothing: antialiased; }
  a { text-decoration: none; }
  button { font-family: inherit; }
  img { max-width: 100%; display: block; }

  #root { position: relative; width: 100%; background: #0A141D; }
  #root.lang-ar { font-family: 'IBM Plex Sans Arabic', 'Inter', sans-serif; }

  header { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; padding: 14px clamp(20px, 6vw, 120px); background: rgba(10, 20, 29, 0.92); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(140, 205, 214, 0.22); }
  header .brand img { height: clamp(28px, 3vw, 38px); width: auto; }
  nav.main-nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px clamp(12px, 2.2vw, 36px); font-family: 'IBM Plex Mono', monospace; font-size: clamp(10px, 1.05vw, 12px); letter-spacing: 0.12em; text-transform: uppercase; }
  nav.main-nav a { color: #F4FBFC; transition: color 0.2s ease; }
  nav.main-nav a:hover, nav.main-nav a.active { color: #18D4E2; }
  nav.main-nav a.contact-cta { color: #18D4E2; border: 1px solid rgba(24, 212, 226, 0.5); padding: 9px 20px; border-radius: 999px; }
  nav.main-nav a.contact-cta:hover { background: rgba(24, 212, 226, 0.1); }
  .lang-btn { background: transparent; border: 1px solid rgba(140, 205, 214, 0.4); color: #8FEAF0; padding: 8px 16px; border-radius: 999px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; transition: border-color 0.2s ease, color 0.2s ease; }
  .lang-btn:hover { border-color: #18D4E2; color: #18D4E2; }

  .hero { position: relative; padding: clamp(80px, 14vh, 160px) clamp(24px, 6vw, 120px) clamp(60px, 8vh, 100px); overflow: hidden; display: grid; gap: 24px; max-width: 900px; margin: 0 auto; }
  .back-link { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.18em; color: #7793A0; justify-self: start; transition: color 0.2s ease; }
  .back-link:hover { color: #18D4E2; }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.24em; color: #7793A0; }
  h1.page-title { font-weight: 700; font-size: clamp(30px, 4vw, 54px); line-height: 1.1; letter-spacing: -0.025em; }
  p.page-intro { color: #AFC7CD; font-size: 17px; line-height: 1.65; }

  .panels-section { position: relative; padding: 0 clamp(24px, 6vw, 120px) clamp(120px, 16vh, 200px); max-width: 900px; margin: 0 auto; display: grid; gap: 24px; border-top: 1px solid rgba(140, 205, 214, 0.22); padding-top: 40px; }
  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; }
  .panel { position: relative; height: 260px; overflow: hidden; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 24px; transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s ease; cursor: pointer; animation: floatA 7s ease-in-out infinite; }
  .panel:nth-child(2) { animation-name: floatB; animation-duration: 8s; }
  .panel:hover { transform: scale(1.06); box-shadow: 0 16px 32px rgba(24, 212, 226, 0.3); }
  .panel img { max-width: 85%; max-height: 85%; object-fit: contain; }
  @keyframes floatA { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(3px, -6px); } }
  @keyframes floatB { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-3px, -4px); } }

  .discovery-cta { justify-self: start; color: #0A141D; background: #18D4E2; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; padding: 14px 26px; border-radius: 999px; transition: opacity 0.2s ease; }
  .discovery-cta:hover { opacity: 0.85; }

  footer { position: relative; background: #0E1B26; border-top: 1px solid rgba(140, 205, 214, 0.22); padding: 24px clamp(24px, 6vw, 120px); display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #567179; }
</style>
</head>
<body>
<div id="root" dir="ltr">
  <header>
    <a class="brand" href="Impact L&amp;D Parallax.dc.html"><img src="assets/logo.png" alt="Impact"></a>
    <nav class="main-nav">
      <a data-t="navHome" href="Impact L&amp;D Parallax.dc.html">Home</a>
      <a data-t="navSolutions" href="Solutions.dc.html">Solutions</a>
      <a data-t="navContact" href="Contact.dc.html" class="contact-cta">Contact</a>
      <button class="lang-btn" id="langToggle" data-t="langBtn" type="button">العربية</button>
    </nav>
  </header>

  <section class="hero">
    <a class="back-link" data-t="back" href="Leading Self.dc.html">← Leading Self</a>
    <div class="eyebrow" data-t="eyebrow">LEADING SELF — BALANCE &amp; WELLBEING</div>
    <h1 class="page-title" data-t="heading">Balance &amp; Wellbeing</h1>
    <p class="page-intro" data-t="intro">Stress management, resilience, and sustainable work habits that protect performance over time.</p>
  </section>

  <section class="panels-section">
    <div class="panels">
      <div class="panel"><img src="assets/logo-bounceback.png" alt="Bounce Back"></div>
      <div class="panel"><img src="assets/logo-relax.png" alt="Relax"></div>
    </div>
    <a class="discovery-cta" data-t="cta" href="Contact.dc.html">Book a Discovery Call</a>
  </section>

  <footer>
    <span data-t="copyright">© 2026 Impact for Learning &amp; Development. All rights reserved.</span>
    <button class="lang-btn" id="langToggleFooter" data-t="langBtn" type="button">العربية</button>
  </footer>
</div>

<script>
(function () {
  var EN = {
    navHome: 'Home', navSolutions: 'Solutions', navContact: 'Contact', langBtn: 'العربية',
    back: '← Leading Self', eyebrow: 'LEADING SELF — BALANCE & WELLBEING', heading: 'Balance & Wellbeing',
    intro: 'Stress management, resilience, and sustainable work habits that protect performance over time.',
    cta: 'Book a Discovery Call', copyright: '© 2026 Impact for Learning & Development. All rights reserved.'
  };
  var AR = {
    navHome: 'الرئيسية', navSolutions: 'الحلول', navContact: 'تواصل معنا', langBtn: 'English',
    back: '← قيادة الذات', eyebrow: 'قيادة الذات — التوازن والرفاهية', heading: 'التوازن والرفاهية',
    intro: 'إدارة الضغط، والمرونة، وعادات عمل مستدامة تحافظ على الأداء بمرور الوقت.',
    cta: 'حجز مكالمة استكشافية', copyright: '© 2026 إمباكت للتعلم والتطوير. جميع الحقوق محفوظة.'
  };

  var root = document.getElementById('root');
  var targets = document.querySelectorAll('[data-t]');

  function applyLang(lang) {
    var t = lang === 'ar' ? AR : EN;
    var isAr = lang === 'ar';
    root.setAttribute('dir', isAr ? 'rtl' : 'ltr');
    root.classList.toggle('lang-ar', isAr);
    document.documentElement.setAttribute('lang', isAr ? 'ar' : 'en');
    document.documentElement.setAttribute('dir', isAr ? 'rtl' : 'ltr');
    targets.forEach(function (el) {
      var key = el.getAttribute('data-t');
      if (t[key] !== undefined) el.textContent = t[key];
    });
  }

  var savedLang = localStorage.getItem('impactLang');
  var currentLang = (savedLang === 'ar' || savedLang === 'en') ? savedLang : 'en';
  applyLang(currentLang);

  function toggleLang() {
    currentLang = currentLang === 'ar' ? 'en' : 'ar';
    localStorage.setItem('impactLang', currentLang);
    applyLang(currentLang);
  }
  document.getElementById('langToggle').addEventListener('click', toggleLang);
  document.getElementById('langToggleFooter').addEventListener('click', toggleLang);
})();
</script>
</body>
</html>
